[project]
name = "pi-learning-benchmark-docling"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "docling-slim[convert-core,format-pdf,models-local,models-vlm-inline,cli]==2.140.0",
  "torch==2.9.1+cpu",
  "torchvision==0.24.1+cpu",
  "opencv-python-headless==4.11.0.86",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
