[project]
name = "pi-learning-benchmark-marker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "marker-pdf==2.0.0",
  "torch==2.9.1+cpu",
  "torchvision==0.24.1+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
