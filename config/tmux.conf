# Servidor exclusivo de pi-learn; no cambia otros servidores de tmux.
source-file -q ~/.config/tmux/tmux.conf
set -g default-shell /usr/bin/fish
set -g default-terminal tmux-256color
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10
# Los procesos nuevos necesitan acceso al portapapeles de la sesión gráfica.
set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK"
# Cerrar la ventana termina pi como un kill: no queda otra instancia viva sobre la misma sesión.
set -g destroy-unattached on
